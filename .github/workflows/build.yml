name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified Inno Setup compiler
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'inno.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $package
          if ((Get-FileHash $package -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Unexpected Inno Setup package hash' }
          if ((Get-AuthenticodeSignature $package).Status -ne 'Valid') { throw 'Invalid compiler installer signature' }
          $toolDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $p = Start-Process $package -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/PORTABLE=1',('/DIR="'+$toolDir+'"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Compiler setup failed' }
          "ISCC_PATH=$toolDir\ISCC.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Installer -Iscc $env:ISCC_PATH
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip
            dist/*-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release-draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: packages
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping the reviewed uploaded assets."
          else
            gh release create "$RELEASE_TAG" packages/* --verify-tag --latest --title "BleAirDock $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          fi
